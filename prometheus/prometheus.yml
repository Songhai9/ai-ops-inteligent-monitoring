# Prometheus Configuration for AI-Powered Anomaly Detection Lab
# Module 4: AIOps Foundations

global:
  # How frequently to scrape targets
  scrape_interval: 15s

  # How frequently to evaluate alerting rules
  evaluation_interval: 15s

  # External labels to attach to all time series and alerts
  external_labels:
    monitor: "aiops-lab"
    environment: "learning"

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          service: "prometheus"
          tier: "monitoring"

  # Node Exporter - System metrics (CPU, memory, disk, network)
  # This is the primary data source for ML anomaly detection in this lab
  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          service: "node-exporter"
          tier: "infrastructure"
          instance_name: "lab-host"

    # Scrape more frequently for better ML training data
    scrape_interval: 10s
    scrape_timeout: 5s

  # Grafana metrics (optional - for advanced monitoring)
  - job_name: "grafana"
    static_configs:
      - targets: ["grafana:3000"]
        labels:
          service: "grafana"
          tier: "monitoring"

# Optional: Recording rules for pre-computed aggregations
# These can speed up dashboard queries and provide consistent baselines
# rule_files:
#   - 'recording_rules.yml'

# Optional: Alerting rules
# In this lab, we'll use Grafana's ML-based alerting instead
# alerting:
